  <rect width="200" height="200" rx="30" fill="#0f1e36" />
  
  <!-- Laurel / Wreath Accents -->
  <path d="M40 130 C30 100, 45 60, 70 45" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 130 C170 100, 155 60, 130 45" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Open Book -->
  <path d="M100 135 C85 125, 60 125, 45 130 L45 85 C60 80, 85 80, 100 90 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M100 135 C115 125, 140 125, 155 130 L155 85 C140 80, 115 80, 100 90 Z" fill="#ffffff" opacity="0.9"/>
  <line x1="100" y1="90" x2="100" y2="135" stroke="#0f1e36" stroke-width="3" />

  <!-- Graduation Cap -->
  <polygon points="100,40 150,60 100,80 50,60" fill="#ffffff" />
  <polygon points="100,48 135,62 100,75 65,62" fill="#0f1e36" />
  <path d="M80 72 L80 92 C80 98, 120 98, 120 92 L120 72" fill="#ffffff" />
  <circle cx="145" cy="70" r="3" fill="#ffffff" />
